<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Viking Strategy Prototype</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.7); color: white;
      padding: 12px; border-radius: 6px; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="ui">
    <h3>Viking Kingdom Map</h3>
    <p>Left-click + Drag to Pan Map</p>
    <p>Right-Click Tile to Build Settlement</p>
  </div>

  <!-- Include Client Dependencies -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // -------------------------------------------------------------
    // 1. INITIALIZE THREE.JS GRAPHICS ENGINE
    // -------------------------------------------------------------
    const MAP_SIZE = 12;
    const TILE_SIZE = 2;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7ec0ee); // Sky color

    const aspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
    camera.position.set(MAP_SIZE * TILE_SIZE, 20, MAP_SIZE * TILE_SIZE + 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // RTS Controls Setup
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableRotate = false; // Lock camera angle
    controls.target.set(MAP_SIZE, 0, MAP_SIZE);
    controls.update();

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(20, 40, 20);
    scene.add(sun);

    // -------------------------------------------------------------
    // 2. TERRAIN & GRID GENERATION
    // -------------------------------------------------------------
    const gridGroup = new THREE.Group();
    const tileGeo = new THREE.BoxGeometry(TILE_SIZE - 0.1, 0.2, TILE_SIZE - 0.1);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x55aa55 });

    for (let x = 0; x < MAP_SIZE; x++) {
      for (let z = 0; z < MAP_SIZE; z++) {
        const tile = new THREE.Mesh(tileGeo, grassMat);
        tile.position.set(x * TILE_SIZE, 0, z * TILE_SIZE);
        // Custom metadata attached to 3D object for raycasting
        tile.userData = { gridX: x, gridZ: z, isTile: true };
        gridGroup.add(tile);
      }
    }
    scene.add(gridGroup);

    // -------------------------------------------------------------
    // 3. MESH SPAWNING FUNCTIONS
    // -------------------------------------------------------------
    const structuresMap = new Map();

    function renderBuilding(gridX, gridZ, id) {
      if (structuresMap.has(id)) return;

      // Create a 3D Viking Building Mesh
      const group = new THREE.Group();
      
      const baseGeo = new THREE.BoxGeometry(1.2, 1.0, 1.2);
      const woodMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
      const base = new THREE.Mesh(baseGeo, woodMat);
      base.position.y = 0.5;

      const roofGeo = new THREE.ConeGeometry(1.1, 0.8, 4);
      const roofMat = new THREE.MeshLambertMaterial({ color: 0x3a1e05 });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.y = 1.4;
      roof.rotation.y = Math.PI / 4;

      group.add(base);
      group.add(roof);
      group.position.set(gridX * TILE_SIZE, 0, gridZ * TILE_SIZE);

      scene.add(group);
      structuresMap.set(id, group);
    }

    // -------------------------------------------------------------
    // 4. RAYCASTING (INTERACTION)
    // -------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('contextmenu', (e) => {
      e.preventDefault(); // Prevent default browser context menu

      // Normalize mouse coordinates to (-1.0 to +1.0)
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(gridGroup.children);

      if (intersects.length > 0) {
        const clickedTile = intersects[0].object;
        const { gridX, gridZ } = clickedTile.userData;

        // Send build command to server
        socket.emit('requestBuild', { gridX, gridZ, type: 'hall' });
      }
    });

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // -------------------------------------------------------------
    // 5. SOCKET.IO NETWORKING INTEGRATION
    // -------------------------------------------------------------
    const socket = io();

    socket.on('initMapState', (structures) => {
      structures.forEach(s => renderBuilding(s.gridX, s.gridZ, s._id));
    });

    socket.on('structurePlaced', (s) => {
      renderBuilding(s.gridX, s.gridZ, s._id);
    });

    socket.on('errorMsg', (msg) => alert(msg));

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
